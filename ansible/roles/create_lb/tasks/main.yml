- name: Create Application Load Balancer
  amazon.aws.elb_application_lb:
    name: "{{ lb_name }}"
    scheme: "{{ lb_scheme }}"
    ip_address_type: "{{ lb_ip_address_type }}"
    security_groups: "{{ lb_security_groups.split(',') }}"
    subnets: "{{ lb_subnets.split(',') }}"
    idle_timeout: "{{ lb_idle_timeout }}"
    access_logs_enabled: "{{ lb_enable_access_logs | bool }}"
    access_logs_s3_bucket: "{{ lb_enable_access_logs | ternary(lb_s3_bucket_name, omit) }}"
    access_logs_s3_prefix: "{{ lb_enable_access_logs | ternary(lb_s3_prefix, omit) }}"
    state: "present"
    region: "{{aws_region}}"
    tags:
      Name: "{{ lb_name }}"
      service: "{{ lb_service }}"
      team: "{{ lb_team }}"
      environment: "{{ lb_environment }}"
    listeners: "{{lb_listners}}"
  register: alb_result

- name: Debug ALB ARN
  debug:
    msg: "ALB created with ARN: {{ alb_result.load_balancer_arn }}"