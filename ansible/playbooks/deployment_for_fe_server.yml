# Playbook to create fresh uat server
# Notes:
#   - ec2up --> Role for creating the EC2 instances. 
#   - upload_fe_configuration_file --> Role for upload build files
# Example invocation:
#   ansible-playbook -vvv /etc/ansible/playbooks/depolyment_on_fe_uat.yml -e deployment_stack="$deployment_stack" -e aws_region="$aws_region" -e private_ip_address="$private_ip_address" 
---
- name: launch instance
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Get instance info from private_ip_address
      include_role:
        name: get_ec2_info
      vars: 
        filter: {"private-ip-address": "{{ private_ip_address.split(',') }}"}   
        check_values: "{{ private_ip_address }}"
        check_attribute: "private_ip_address"         
      when: private_ip_address is defined  

    - name: start ec2 instance
      include_role:
       name: "ec2up"
      vars:
        action: "start"
        ec2_instance_ids: "{{ instance_info.instances | map(attribute='instance_id') | join(',') if private_ip_address is defined else []}}"

- name: depolyment and build on fresh server 
  hosts: launched-instances
  gather_facts: false
  become: yes
  tasks:
     - name: run the script of pull-and-build.sh
       shell: |
        export PATH=/root/.nvm/versions/node/v14.18.2/bin:$PATH
        sh /root/scripts/pull-and-build.sh

     - name: role to upload configuration file
       include_role:
         name: "upload_fe_configuration_files"