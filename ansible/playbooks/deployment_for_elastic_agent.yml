# Playbook for elastic-agent deployment with autoscaling group using ALB.
# Notes:
#   - create_lt --> Role for creating the Launch Template for EC2 Autoscaling.
#   - create_lt_asg --> Role for creating the Autoscaling Group.
#   - create_autoscaling_policy --> Role for creating the Autoscaling policy.
# Example invocation:
#   ansible-playbook -vvv /etc/ansible/playbooks/deployment_for_elastic_agent.yml -e elastic_agent_role="$elastic_agent_role" -e elastic_agent_name="$elastic_agent_name" -e start_job_build_number="$start_job_build_number" -e aws_region="$aws_region" -e processor_type="$processor_type" -e graviton_ec2_ami_id="$graviton_ec2_ami_id" -e intel_ec2_ami_id="$intel_ec2_ami_id" -e ec2_tag_Name="$ec2_tag_Name" -e ec2_tag_environment="$ec2_tag_environment" -e ec2_tag_cluster="$ec2_tag_cluster" -e ec2_tag_service="$ec2_tag_service" -e ec2_tag_team="$ec2_tag_team" -e ec2_tag_app_version="$ec2_tag_app_version" -e ec2_tag_os="$ec2_tag_os" -e ec2_tag_os_user="$ec2_tag_os_user" -e ec2_tag_ssh_port="$ec2_tag_ssh_port" -e ec2_key_pair="$ec2_key_pair" -e ec2_instance_profile="$ec2_instance_profile" -e ec2_sg_id="$ec2_sg_id" -e ec2_volume_size="$ec2_volume_size" -e lt_name="$lt_name" -e lt_version="$lt_version" -e asg_name="$asg_name" -e asg_base_size="$asg_base_size" -e asg_above_base_percent="$asg_above_base_percent" -e asg_min_size="$asg_min_size" -e asg_max_size="$asg_max_size" -e asg_desired_size="$asg_desired_size"  -e asg_health_check_type="$asg_health_check_type" -e asg_health_check_period="$asg_health_check_period" -e asg_vpc_subnets="$asg_vpc_subnets" -e asg_capacity_rebalance="$asg_capacity_rebalance" -e instance_type_list="$instance_type_list" -e on_demand_allocation_strategy="$on_demand_allocation_strategy" -e spot_allocation_strategy="$spot_allocation_strategy" -e lb_type="$lb_type" -e lb_entity="$lb_entity" -e asp_enable="$asp_enable" -e asp_name="$asp_name" -e asp_predefined_metric_type="$asp_predefined_metric_type" -e asp_cooldown="$asp_cooldown" -e asp_target_value="$asp_target_value" -e asp_disable_scalein="$asp_disable_scalein" -e elastic_fleet_enrolment_token="$elastic_fleet_enrolment_token" -e elastic_fleet_tags="$elastic_fleet_tags" -e elastic_fleet_url="$elastic_fleet_url" -e elastic_agent_version="$elastic_agent_version" -e es_host="$es_host" -e fleet_server_policy_id="$fleet_server_policy_id" -e fleet_service_token="$fleet_service_token" -e deployment_stack="$deployment_stack"

- hosts: "localhost"
  roles:
    - { role: "create_lt", ami_id: "{{vars[processor_type + '_ec2_ami_id'] }}" }
    - { role: "create_lt_asg" }
    - { role: "create_autoscaling_policy", when: asp_enable == "true" }