# Generic Playbook for creating Autoscaling policy
# Notes:
#   - create_autoscaling_policy --> Role for creating the Autoscaling policy.
# Example-1 invocation:
#   ansible-playbook -vvv /etc/ansible/playbooks/create_autoscaling_policy.yml -e asp_name="$asp_name" -e asp_target_value="$asp_target_value" -e asg_name="$asg_name" -e asp_enable="$asp_enable"  -e asp_cooldown="$asp_cooldown" -e asp_predefined_metric_type="$asp_predefined_metric_type" 
# Example-2 invocation if asp_predefined_metric_type=ALBRequestCountPerTarget:
#   ansible-playbook -vvv /etc/ansible/playbooks/create_autoscaling_policy.yml -e asp_name="$asp_name" -e asp_target_value="$asp_target_value" -e asg_name="$asg_name" -e asp_enable="$asp_enable" -e asp_resource_label="$asp_resource_label" -e asp_cooldown="$asp_cooldown" -e asp_predefined_metric_type="$asp_predefined_metric_type" 

- hosts: "localhost"$
  roles:
    - { role: "create_autoscaling_policy" }

