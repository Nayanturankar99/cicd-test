# Playbook to create AMI from an EC2 instance
# Notes:
#   - create_ami --> Role for creating AMI
# Example invocation:
#   ansible-playbook -vvv /etc/ansible/playbooks/create_ami.yml -e ami_instance_id="$instance_id" -e ami_name="$ami_name" -e ami_tag_environment="$ami_environment" -e aws_region="$aws_region" -e ami_tag_service_name="$ami_tag_service_name" -e ami_tag_team="$ami_tag_team" -e ami_tag_app_version="$ami_tag_app_version" -e ec2_tag_os="$ec2_tag_os" -e ec2_tag_os_user="$ec2_tag_os_user" -e ec2_tag_ssh_port="$ec2_tag_ssh_port"

- hosts: "{{playbook_host}}"
  roles:
    - { role: "create_ami" }
